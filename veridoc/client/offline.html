<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode Verified — AegisDoc Forensics</title>
  <link rel="stylesheet" href="styles.css?v=3.10.0">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: Inter, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .offline-card { max-width: 520px; text-align: center; background: #0b1329; border: 1px solid #10b981; padding: 36px 28px; border-radius: 12px; }
    .offline-badge { display: inline-block; background: rgba(16, 185, 129, 0.15); color: #10b981; font-family: monospace; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 4px; margin-bottom: 16px; border: 1px solid #10b981; }
    .offline-title { font-size: 1.35rem; font-weight: 800; margin-bottom: 12px; color: #ffffff; }
    .offline-desc { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .offline-btn { display: inline-block; background: #10b981; color: #022c22; padding: 10px 22px; border-radius: 6px; text-decoration: none; font-weight: 800; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-badge">AIRPLANE MODE VERIFIED</div>
    <div class="offline-title">100% On-Device Forensic Enclave</div>
    <p class="offline-desc">You are currently offline or in Airplane Mode. AegisDoc's WebAssembly & WebGL forensic engine is completely cached on this device and ready to analyze financial documents with zero network access.</p>
    <a href="./#/scan" class="offline-btn">Launch Scanner in Offline Mode</a>
  </div>
</body>
</html>
