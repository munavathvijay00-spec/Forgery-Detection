<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | AegisDoc Forensics</title>
  <link rel="stylesheet" href="styles.css?v=3.10.0">
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: Inter, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .err-card { max-width: 480px; text-align: center; background: #1e293b; border: 1px solid #334155; padding: 36px 28px; border-radius: 12px; }
    .err-code { font-family: monospace; font-size: 3rem; font-weight: 800; color: #38bdf8; margin-bottom: 8px; }
    .err-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
    .err-desc { font-size: 0.88rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .err-btn { display: inline-block; background: #0284c7; color: #ffffff; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="err-card">
    <div class="err-code">404</div>
    <div class="err-title">Forensic Audit Route Not Found</div>
    <p class="err-desc">The requested forensic route or verification resource does not exist in the AegisDoc local enclave.</p>
    <a href="./#/home" class="err-btn">Return to AegisDoc Operations</a>
  </div>
